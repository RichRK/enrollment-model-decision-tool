[project]
name = "enrollment-model-decision-tool"
version = "0.1.0"
description = "Pipeline that assembles DHS survey, WorldPop and World Bank data into data/regions.json for the static enrollment-exclusion site."
requires-python = ">=3.12"
dependencies = [
    "shapely==2.1.2",
    "rasterio==1.5.0",
    "numpy==2.5.1",
    "pandas==3.0.5",
]

[tool.uv]
# This directory is a flat script collection, not an importable package -- no
# __init__.py, no src/ layout; run_all.py manipulates sys.path to import its
# sibling modules directly. Without this, `uv sync`/`uv run` would try to
# build and install the project itself as a package. `package = false` marks
# it as dependencies-only.
package = false
